<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    @layer base {
      html, body {
        width: 100vw;
        margin: 0;
        padding: 0;
      }
      body {
        overscroll-behavior: none;
      }
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .pt-safe {
        padding-top: env(safe-area-inset-top, 0px);
      }
      main > :first-child {
        margin-top: 0 !important;
      }
      main > :last-child {
        margin-bottom: 0 !important;
      }
    }
    ::-webkit-scrollbar {
      display: none;
    }

    @keyframes auraPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.35;
      }
      50% {
        transform: scale(1.1);
        opacity: 0.65;
      }
    }
    .animate-aura {
      animation: auraPulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-cream": "#F8F6F1",
            "text-indigo": "#17172B",
            "primary-electric": "#5146E5",
            "primary": "#5146e5",
            "on-primary": "#ffffff",
            "outline": "#777587"
          },
          fontFamily: {
            "sans": ["Plus Jakarta Sans", "sans-serif"]
          }
        }
      }
    }
  </script>
</head>

<!-- Status badge: 5 people ready to connect -->

<span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
<span class="text-xs font-medium text-emerald-800 tracking-tight">5 people ready to connect</span>
</div>
<!-- Typography -->
<h1 class="text-[27px] leading-tight font-bold text-[#17172B] tracking-tight mb-2">Connecting your family...</h1>
<p class="text-[14px] text-[#17172B]/60 font-normal mb-8">Opening your call room on Daily.co</p>
<!-- Three Rhythmic Pulsing Connecting Dots -->
<div class="flex items-center justify-center space-x-2">
<span class="w-1.5 h-1.5 rounded-full bg-[#5146E5] animate-pulse"></span>
<span class="w-1.5 h-1.5 rounded-full bg-[#5146E5]/60 animate-pulse" style="animation-delay: 250ms;"></span>
<span class="w-1.5 h-1.5 rounded-full bg-[#5146E5]/30 animate-pulse" style="animation-delay: 500ms;"></span>
</div>
</div>
<!-- Actions & Bottom Security Reassurance -->
<div class="w-full max-w-xs flex flex-col items-center pb-2">
<!-- Primary Action -->
<button class="w-full h-12 rounded-full text-white font-semibold text-[15px] tracking-wide shadow-[0_6px_20px_rgba(81,70,229,0.28)] hover:shadow-[0_8px_24px_rgba(81,70,229,0.36)] hover:bg-[#473ccd] active:scale-[0.98] transition-all duration-200 flex items-center justify-center" id="cta-open-room" style="background-color: #5146E5;">
        Join room
      </button>
<!-- Secondary Action -->
<button class="w-full py-3.5 text-[#17172B]/60 hover:text-[#17172B] text-[14px] font-medium transition-colors mt-0.5 active:opacity-70" id="cta-cancel">
        Cancel
      </button>
<!-- Security reassurance -->
<div class="mt-4 flex items-center gap-1.5 text-[11px] text-[#17172B]/40 font-medium tracking-wide">
<span class="material-symbols-outlined text-[13px]">lock</span>
<span>Encrypted call via Daily.co</span>
</div>
</div>
<script>
      (function() {
        var openRoomBtn = document.getElementById('cta-open-room');
        var cancelBtn = document.getElementById('cta-cancel');

        if (openRoomBtn) {
          openRoomBtn.addEventListener('click', function() {
            this.classList.add('opacity-90');
          });
        }

        if (cancelBtn) {
          cancelBtn.addEventListener('click', function() {
            window.history.back();
          });
        }
      })();
    </script>
</main>
</body></html>
